version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: child_dna_db
    environment:
      POSTGRES_USER: child_dna
      POSTGRES_PASSWORD: password
      POSTGRES_DB: child_dna
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U child_dna -d child_dna"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: child_dna_backend
    environment:
      - DATABASE_URL=postgresql://child_dna:password@db:5432/child_dna
      - DEBUG=true
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data: